name: Generate Appcast

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Build and Publish Release"]
    types: [completed]

jobs:
  generate_appcast:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Get latest release tag (supports prereleases)
      run: |
        REPO="${{ github.repository }}"

        # Fetch releases with authentication (prevents 404 + rate limits)
        RELEASES=$(curl -s \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/$REPO/releases)

        # Extract newest release tag safely
        TAG=$(echo "$RELEASES" | jq -r 'if type=="array" and length>0 then .[0].tag_name else empty end')

        if [ -z "$TAG" ]; then
          echo "ERROR: No releases found"
          exit 1
        fi

        VERSION="${TAG#v}"
        VERSION_NUMERIC=$(echo "$VERSION" | sed 's/-.*//').0

        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION_NUMERIC=$VERSION_NUMERIC" >> $GITHUB_ENV

    - name: Generate appcast.xml
      run: |
        echo "<rss version=\"2.0\" xmlns:sparkle=\"http://www.andymatuschak.org/xml-namespaces/sparkle\">" > appcast.xml
        echo "  <channel>" >> appcast.xml
        echo "    <title>LumenRGB Updates</title>" >> appcast.xml

        # Windows item
        echo "    <item>" >> appcast.xml
        echo "      <title>${VERSION}</title>" >> appcast.xml
        echo "      <releaseNotes><![CDATA[Release notes available on GitHub]]></releaseNotes>" >> appcast.xml
        echo "      <enclosure url=\"https://github.com/${{ github.repository }}/releases/download/${TAG}/LumenRGB-Setup-${VERSION}.exe\" sparkle:version=\"${VERSION_NUMERIC}\" />" >> appcast.xml
        echo "    </item>" >> appcast.xml

        # Linux item
        echo "    <item>" >> appcast.xml
        echo "      <title>${VERSION}</title>" >> appcast.xml
        echo "      <releaseNotes><![CDATA[Release notes available on GitHub]]></releaseNotes>" >> appcast.xml
        echo "      <enclosure url=\"https://github.com/${{ github.repository }}/releases/download/${TAG}/LumenRGB-${VERSION}.AppImage\" sparkle:version=\"${VERSION_NUMERIC}\" />" >> appcast.xml
        echo "    </item>" >> appcast.xml

        echo "  </channel>" >> appcast.xml
        echo "</rss>" >> appcast.xml

    - name: Upload appcast.xml
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        files: appcast.xml
        overwrite_files: true
