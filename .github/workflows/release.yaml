name: Build and Publish Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid: [ "win-x64", "linux-x64" ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Restore
      run: dotnet restore

    - name: Publish self-contained
      run: |
        dotnet publish LumenRGB.UI.Avalonia/LumenRGB.UI.Avalonia.csproj \
          -c Release \
          -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:Version=${{ env.VERSION }}

    - name: Upload published output
      uses: actions/upload-artifact@v4
      with:
        name: publish-${{ matrix.rid }}
        path: LumenRGB.UI.Avalonia/bin/Release/net8.0/${{ matrix.rid }}/publish/

  windows_installer:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Extract numeric version for NSIS
      run: echo "VERSION_NUMERIC=$(echo $VERSION | sed 's/-.*//').0" >> $GITHUB_ENV

    - name: Download Windows publish
      uses: actions/download-artifact@v4
      with:
        name: publish-win-x64
        path: publish

    - name: Rename Windows executable
      run: mv publish/LumenRGB.UI.Avalonia.exe publish/LumenRGB.exe

    - name: Install NSIS
      run: sudo apt-get update && sudo apt-get install -y nsis

    - name: Build NSIS installer
      run: |
        cd installers/nsis
        makensis -DVERSION=${{ env.VERSION }} -DVERSION_NUMERIC=${{ env.VERSION_NUMERIC }} installer.nsi

    - name: Upload installer
      uses: softprops/action-gh-release@v2
      with:
        files: installers/nsis/LumenRGB-Setup-${{ env.VERSION }}.exe
        overwrite_files: true

  linux_appimage:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Download Linux publish
      uses: actions/download-artifact@v4
      with:
        name: publish-linux-x64
        path: installers/appimage/AppDir/usr/bin

    - name: Rename Linux executable
      run: mv installers/appimage/AppDir/usr/bin/LumenRGB.UI.Avalonia installers/appimage/AppDir/usr/bin/LumenRGB

    - name: Prepare AppDir
      run: |
        chmod +x installers/appimage/AppDir/usr/bin/LumenRGB
        chmod +x installers/appimage/AppDir/AppRun

    - name: Install desktop-file-utils
      run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

    - name: Download appimagetool
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    - name: Extract appimagetool (FUSE workaround)
      run: |
        ./appimagetool-x86_64.AppImage --appimage-extract
        chmod +x squashfs-root/usr/bin/appimagetool

    - name: Remove extra AppRun binaries
      run: |
        rm -f squashfs-root/AppRun
        rm -f squashfs-root/usr/bin/AppRun

    - name: Build AppImage
      run: ARCH=x86_64 squashfs-root/usr/bin/appimagetool installers/appimage/AppDir LumenRGB-${{ env.VERSION }}.AppImage

    - name: Upload AppImage
      uses: softprops/action-gh-release@v2
      with:
        files: LumenRGB-${{ env.VERSION }}.AppImage

  update_appcast:
    runs-on: ubuntu-latest
    needs: [windows_installer, linux_appimage]

    steps:
    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Download Windows installer
      run: |
        for i in {1..40}; do
          wget -L --content-disposition --trust-server-names \
            --header="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            --header="X-GitHub-Api-Version: 2022-11-28" \
            -O LumenRGB-Setup-${VERSION}.exe \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/LumenRGB-Setup-${VERSION}.exe" && break
          echo "Windows installer not available yet. Retrying..."
          sleep 3
        done

    - name: Download AppImage
      run: |
        for i in {1..40}; do
          wget -L --content-disposition --trust-server-names \
            --header="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            --header="X-GitHub-Api-Version: 2022-11-28" \
            -O LumenRGB-${VERSION}.AppImage \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/LumenRGB-${VERSION}.AppImage" && break
          echo "AppImage not available yet. Retrying..."
          sleep 3
        done

    - name: Compute SHA256 checksums
      run: |
        echo "SHA_WIN=$(sha256sum LumenRGB-Setup-${VERSION}.exe | awk '{print $1}')" >> $GITHUB_ENV
        echo "SHA_LINUX=$(sha256sum LumenRGB-${VERSION}.AppImage | awk '{print $1}')" >> $GITHUB_ENV

    - name: Generate appcast.xml
      run: |
        echo "<rss version=\"2.0\" xmlns:sparkle=\"http://www.andymatuschak.org/xml-namespaces/sparkle\">" > appcast.xml
        echo "  <channel>" >> appcast.xml
        echo "    <title>LumenRGB Updates</title>" >> appcast.xml
        echo "    <item>" >> appcast.xml
        echo "      <title>${VERSION}</title>" >> appcast.xml
        echo "      <releaseNotes><![CDATA[${{ github.event.release.body }}]]></releaseNotes>" >> appcast.xml
        echo "      <enclosure url=\"https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/LumenRGB-Setup-${VERSION}.exe\" sparkle:sha256=\"${SHA_WIN}\" />" >> appcast.xml
        echo "      <enclosure url=\"https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/LumenRGB-${VERSION}.AppImage\" sparkle:sha256=\"${SHA_LINUX}\" />" >> appcast.xml
        echo "    </item>" >> appcast.xml
        echo "  </channel>" >> appcast.xml
        echo "</rss>" >> appcast.xml

    - name: Upload appcast.xml
      uses: softprops/action-gh-release@v2
      with:
        files: appcast.xml
