name: Build and Publish Release

permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid: [ "win-x64", "linux-x64" ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Restore
      run: dotnet restore LumenRGB.UI.Avalonia.Desktop/LumenRGB.UI.Avalonia.Desktop.csproj

    - name: Publish self-contained
      run: |
        dotnet publish LumenRGB.UI.Avalonia.Desktop/LumenRGB.UI.Avalonia.Desktop.csproj \
          -c Release \
          -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:Version=${{ env.VERSION }}

    - name: Upload published output
      uses: actions/upload-artifact@v4
      with:
        name: publish-${{ matrix.rid }}
        path: LumenRGB.UI.Avalonia.Desktop/bin/Release/net8.0/${{ matrix.rid }}/publish/

  windows_installer:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Extract numeric version for NSIS
      run: echo "VERSION_NUMERIC=$(echo $VERSION | sed 's/-.*//').0" >> $GITHUB_ENV

    - name: Download Windows publish
      uses: actions/download-artifact@v4
      with:
        name: publish-win-x64
        path: publish

    - name: Install NSIS
      run: sudo apt-get update && sudo apt-get install -y nsis

    - name: Build NSIS installer
      run: |
        cd installers/nsis
        makensis -DVERSION=${{ env.VERSION }} -DVERSION_NUMERIC=${{ env.VERSION_NUMERIC }} installer.nsi

    - name: Upload installer
      uses: softprops/action-gh-release@v2
      with:
        files: installers/nsis/LumenRGB-Setup-${{ env.VERSION }}.exe
        overwrite_files: true

  linux_appimage:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Download Linux publish
      uses: actions/download-artifact@v4
      with:
        name: publish-linux-x64
        path: installers/appimage/AppDir/usr/bin

    - name: Prepare AppDir
      run: |
        chmod +x installers/appimage/AppDir/usr/bin/LumenRGB
        chmod +x installers/appimage/AppDir/AppRun

    - name: Install desktop-file-utils
      run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

    - name: Download appimagetool
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    - name: Extract appimagetool (FUSE workaround)
      run: |
        ./appimagetool-x86_64.AppImage --appimage-extract
        chmod +x squashfs-root/usr/bin/appimagetool

    - name: Remove extra AppRun binaries
      run: |
        rm -f squashfs-root/AppRun
        rm -f squashfs-root/usr/bin/AppRun

    - name: Build AppImage
      run: ARCH=x86_64 squashfs-root/usr/bin/appimagetool installers/appimage/AppDir LumenRGB-${{ env.VERSION }}.AppImage

    - name: Upload AppImage
      uses: softprops/action-gh-release@v2
      with:
        files: LumenRGB-${{ env.VERSION }}.AppImage

  android_apk:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version from tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Install Android workload
      run: dotnet workload install android

    - name: Restore
      run: dotnet restore LumenRGB.UI.Avalonia.Mobile.Android/LumenRGB.UI.Avalonia.Mobile.Android.csproj

    - name: Build unsigned APK
      run: |
        dotnet publish LumenRGB.UI.Avalonia.Mobile.Android/LumenRGB.UI.Avalonia.Mobile.Android.csproj \
          -c Release \
          -f net8.0-android \
          -p:Version=${{ env.VERSION }} \
          -p:AndroidPackageFormat=apk

    - name: Upload APKs
      uses: softprops/action-gh-release@v2
      with:
        files: |
          LumenRGB-${{ env.VERSION }}-unsigned.apk
        overwrite_files: true
